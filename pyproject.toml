[project]
name = "tap-proxy"
version = "0.1.0"
description = "Multi-client TAP gateway exposed over ZeroMQ"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "pyzmq>=25.1.0",
    "vnpy-tap>=9.4.11; platform_system == 'Windows' or (platform_system == 'Linux' and platform_machine == 'x86_64')",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
